<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1088" viewBox="0 0 1000 1088" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowlite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="1088" fill="#ffffff"/>

  <!-- ================= Title ================= -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">ezmsg &#183; AxisArray</text>
  <text x="40" y="70" font-size="14" fill="#475569">A message = an N-dimensional array + a name for every axis + optional coordinates + metadata.</text>

  <!-- ================= Panel 1: fields ================= -->
  <rect x="40" y="96" width="440" height="434" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M40 106 a10 10 0 0 1 10 -10 h420 a10 10 0 0 1 10 10 v28 h-440 z" fill="#1f2937"/>
  <text x="60" y="126" font-size="14" font-weight="700" fill="#f8fafc">AxisArray fields (dataclass)</text>

  <!-- row 1 -->
  <rect x="58" y="150" width="96" height="24" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="106" y="167" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Menlo, monospace">data</text>
  <text x="166" y="161" font-size="12.5" fill="#0f172a" font-family="Menlo, monospace">NDArray</text>
  <text x="166" y="177" font-size="12" fill="#475569">numeric payload (numpy, cupy, torch, MLX &#8230;)</text>

  <!-- row 2 -->
  <rect x="58" y="196" width="96" height="24" rx="5" fill="#d1fae5" stroke="#059669"/>
  <text x="106" y="213" font-size="13" font-weight="700" fill="#047857" text-anchor="middle" font-family="Menlo, monospace">dims</text>
  <text x="166" y="207" font-size="12.5" fill="#0f172a" font-family="Menlo, monospace">list[str]</text>
  <text x="166" y="223" font-size="12" fill="#475569">one unique name per axis; len(dims) == data.ndim</text>

  <!-- row 3 -->
  <rect x="58" y="242" width="96" height="24" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="106" y="259" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle" font-family="Menlo, monospace">axes</text>
  <text x="166" y="253" font-size="12.5" fill="#0f172a" font-family="Menlo, monospace">dict[str, AxisBase]</text>
  <text x="166" y="269" font-size="12" fill="#475569">coordinates for a dim (optional, per dim)</text>

  <!-- row 4 -->
  <rect x="58" y="288" width="96" height="24" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="106" y="305" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="Menlo, monospace">attrs</text>
  <text x="166" y="299" font-size="12.5" fill="#0f172a" font-family="Menlo, monospace">dict[str, Any]</text>
  <text x="166" y="315" font-size="12" fill="#475569">free-form metadata carried downstream</text>

  <!-- row 5 -->
  <rect x="58" y="334" width="96" height="24" rx="5" fill="#fce7f3" stroke="#db2777"/>
  <text x="106" y="351" font-size="13" font-weight="700" fill="#be185d" text-anchor="middle" font-family="Menlo, monospace">key</text>
  <text x="166" y="345" font-size="12.5" fill="#0f172a" font-family="Menlo, monospace">str</text>
  <text x="166" y="361" font-size="12" fill="#475569">stream / source identifier (e.g. device name)</text>

  <!-- row 6 -->
  <rect x="58" y="380" width="96" height="24" rx="5" fill="#cffafe" stroke="#0891b2"/>
  <text x="106" y="397" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle" font-family="Menlo, monospace">stream_dim</text>
  <text x="166" y="391" font-size="12.5" fill="#0f172a" font-family="Menlo, monospace">str | None</text>
  <text x="166" y="407" font-size="12" fill="#475569">dimension messages append along, e.g. &quot;time&quot;</text>

  <!-- row 7 -->
  <rect x="58" y="426" width="96" height="24" rx="5" fill="#ecfccb" stroke="#65a30d"/>
  <text x="106" y="443" font-size="13" font-weight="700" fill="#4d7c0f" text-anchor="middle" font-family="Menlo, monospace">segment</text>
  <text x="166" y="437" font-size="12.5" fill="#0f172a" font-family="Menlo, monospace">int</text>
  <text x="166" y="453" font-size="12" fill="#475569">changes when the data stop being continuous</text>

  <!-- row 8 -->
  <rect x="58" y="472" width="96" height="24" rx="5" fill="#e2e8f0" stroke="#475569"/>
  <text x="106" y="489" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Menlo, monospace">config_id</text>
  <text x="166" y="483" font-size="12.5" fill="#0f172a" font-family="Menlo, monospace">int</text>
  <text x="166" y="499" font-size="12" fill="#475569">layout digest; changes on reconfiguration</text>

  <!-- ================= Panel 2: worked example ================= -->
  <rect x="512" y="96" width="448" height="434" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M512 106 a10 10 0 0 1 10 -10 h428 a10 10 0 0 1 10 10 v28 h-448 z" fill="#1f2937"/>
  <text x="532" y="126" font-size="14" font-weight="700" fill="#f8fafc">A 2-D example: 128 samples &#215; 32 channels</text>

  <!-- ch axis label (top) -->
  <text x="700" y="164" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle" font-family="Menlo, monospace">dims[1] = "ch"</text>
  <line x1="612" y1="176" x2="900" y2="176" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- time axis label (left) -->
  <text x="576" y="290" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle" font-family="Menlo, monospace" transform="rotate(-90 576 290)">dims[0] = "time"</text>
  <line x1="600" y1="188" x2="600" y2="330" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- data grid -->
  <g fill="#dbeafe" stroke="#60a5fa">
    <rect x="612" y="188" width="34" height="22"/><rect x="648" y="188" width="34" height="22"/><rect x="684" y="188" width="34" height="22"/><rect x="720" y="188" width="34" height="22"/><rect x="756" y="188" width="34" height="22"/><rect x="792" y="188" width="34" height="22"/><rect x="828" y="188" width="34" height="22"/><rect x="864" y="188" width="34" height="22"/>
    <rect x="612" y="212" width="34" height="22"/><rect x="648" y="212" width="34" height="22"/><rect x="684" y="212" width="34" height="22"/><rect x="720" y="212" width="34" height="22"/><rect x="756" y="212" width="34" height="22"/><rect x="792" y="212" width="34" height="22"/><rect x="828" y="212" width="34" height="22"/><rect x="864" y="212" width="34" height="22"/>
    <rect x="612" y="236" width="34" height="22"/><rect x="648" y="236" width="34" height="22"/><rect x="684" y="236" width="34" height="22"/><rect x="720" y="236" width="34" height="22"/><rect x="756" y="236" width="34" height="22"/><rect x="792" y="236" width="34" height="22"/><rect x="828" y="236" width="34" height="22"/><rect x="864" y="236" width="34" height="22"/>
    <rect x="612" y="260" width="34" height="22"/><rect x="648" y="260" width="34" height="22"/><rect x="684" y="260" width="34" height="22"/><rect x="720" y="260" width="34" height="22"/><rect x="756" y="260" width="34" height="22"/><rect x="792" y="260" width="34" height="22"/><rect x="828" y="260" width="34" height="22"/><rect x="864" y="260" width="34" height="22"/>
    <rect x="612" y="284" width="34" height="22"/><rect x="648" y="284" width="34" height="22"/><rect x="684" y="284" width="34" height="22"/><rect x="720" y="284" width="34" height="22"/><rect x="756" y="284" width="34" height="22"/><rect x="792" y="284" width="34" height="22"/><rect x="828" y="284" width="34" height="22"/><rect x="864" y="284" width="34" height="22"/>
  </g>
  <text x="906" y="205" font-size="16" fill="#94a3b8">&#8230;</text>
  <text x="755" y="325" font-size="16" fill="#94a3b8" text-anchor="middle">&#8942;</text>
  <text x="906" y="248" font-size="11" fill="#64748b">data</text>

  <!-- axes callouts -->
  <line x1="800" y1="176" x2="800" y2="156" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrowlite)"/>
  <text x="616" y="152" font-size="11" fill="#b45309" font-family="Menlo, monospace">axes["ch"] = CoordinateAxis(["Fz","Cz",&#8230;])</text>

  <text x="616" y="352" font-size="11" fill="#b45309" font-family="Menlo, monospace">axes["time"] = LinearAxis(gain=1/500, offset=t0)</text>
  <text x="616" y="370" font-size="11" fill="#64748b" font-family="Menlo, monospace">&#8594; value(i) = i * gain + offset   (500 Hz)</text>

  <!-- stream strip -->
  <text x="532" y="402" font-size="12" fill="#475569">Successive messages along <tspan font-family="Menlo, monospace">stream_dim = "time"</tspan></text>
  <g font-family="Menlo, monospace" font-size="11" text-anchor="middle">
    <rect x="532" y="412" width="96" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="580" y="429" fill="#1d4ed8">segment 0</text>
    <rect x="632" y="412" width="96" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="680" y="429" fill="#1d4ed8">segment 0</text>
    <rect x="732" y="412" width="64" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="764" y="429" fill="#1d4ed8">seg 0</text>
    <text x="818" y="429" fill="#94a3b8">gap</text>
    <rect x="840" y="412" width="100" height="26" rx="4" fill="#ecfccb" stroke="#65a30d"/><text x="890" y="429" fill="#4d7c0f">segment 1</text>
  </g>
  <line x1="532" y1="450" x2="940" y2="450" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="940" y="466" font-size="11" fill="#047857" text-anchor="end" font-family="Menlo, monospace">time</text>
  <text x="532" y="490" font-size="11.5" fill="#475569"><tspan font-family="Menlo, monospace" fill="#4d7c0f">segment</tspan> changes &#8594; this message does not continue the last one</text>
  <text x="532" y="508" font-size="11.5" fill="#475569"><tspan font-family="Menlo, monospace" fill="#334155">config_id</tspan> changes &#8594; the layout changed (channels, rate, dtype &#8230;)</text>

  <g transform="translate(0,138)">
  <!-- ================= Panel 3: code ================= -->
  <rect x="40" y="412" width="920" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M40 422 a10 10 0 0 1 10 -10 h900 a10 10 0 0 1 10 10 v28 h-920 z" fill="#1f2937"/>
  <text x="60" y="442" font-size="14" font-weight="700" fill="#f8fafc">Construction and access</text>

  <g font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a" xml:space="preserve">
    <text x="62" y="475">aa = AxisArray(</text>
    <text x="62" y="494">    data  = np.zeros((128, 32)),<tspan fill="#64748b">               # 128 samples &#215; 32 channels</tspan></text>
    <text x="62" y="513">    dims  = ["time", "ch"],</text>
    <text x="62" y="532">    axes  = {"time": LinearAxis(gain=1/500.0, offset=t0, unit="s"),</text>
    <text x="62" y="551">             "ch":   CoordinateAxis(data=ch_names, dims=["ch"], unit="label")},</text>
    <text x="62" y="570">    attrs = {"subject": "S01"},   key = "eeg",   stream_dim = "time",</text>
    <text x="62" y="589">)</text>
  </g>
  <line x1="62" y1="602" x2="938" y2="602" stroke="#e2e8f0"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#334155" xml:space="preserve">
    <text x="62" y="622">aa.ax("time").values  <tspan fill="#64748b">&#8594; coordinate value per index</tspan></text>
    <text x="530" y="622">aa.sel(time=slice(1.0, 2.0))  <tspan fill="#64748b">&#8594; by label</tspan></text>
    <text x="62" y="641">aa.shape2d("time")    <tspan fill="#64748b">&#8594; (128, 32)</tspan></text>
    <text x="530" y="641">aa.isel(ch=slice(0, 8))       <tspan fill="#64748b">&#8594; by index</tspan></text>
  </g>

  <!-- ================= Panel 4: class hierarchy ================= -->
  <rect x="40" y="682" width="920" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M40 692 a10 10 0 0 1 10 -10 h900 a10 10 0 0 1 10 10 v28 h-920 z" fill="#1f2937"/>
  <text x="60" y="712" font-size="14" font-weight="700" fill="#f8fafc">Type hierarchy</text>

  <!-- ArrayWithNamedDims -->
  <rect x="66" y="742" width="212" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="172" y="763" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Menlo, monospace">ArrayWithNamedDims</text>
  <text x="172" y="781" font-size="11.5" fill="#64748b" text-anchor="middle" font-family="Menlo, monospace">data, dims</text>

  <!-- AxisBase -->
  <rect x="66" y="818" width="212" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="172" y="839" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Menlo, monospace">AxisBase (ABC)</text>
  <text x="172" y="857" font-size="11.5" fill="#64748b" text-anchor="middle" font-family="Menlo, monospace">unit &#183; value(index)</text>

  <!-- AxisArray -->
  <rect x="366" y="734" width="248" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="490" y="756" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Menlo, monospace">AxisArray</text>
  <text x="490" y="774" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-family="Menlo, monospace">+ axes, attrs, key,</text>
  <text x="490" y="791" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-family="Menlo, monospace">stream_dim, segment, config_id</text>

  <!-- LinearAxis -->
  <rect x="366" y="812" width="248" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="490" y="832" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="Menlo, monospace">LinearAxis</text>

  <!-- CoordinateAxis -->
  <rect x="366" y="848" width="248" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="490" y="868" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="Menlo, monospace">CoordinateAxis</text>

  <!-- edges -->
  <line x1="278" y1="768" x2="360" y2="768" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M278 844 H 322 V 827 H 360" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M278 844 H 322 V 863 H 360" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M100 794 V 892 H 490 V 882" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowlite)"/>

  <!-- annotations -->
  <text x="632" y="763" font-size="11" fill="#475569">the message class passed between ezmsg Units</text>
  <text x="632" y="780" font-size="11" fill="#475569">+ .isel .sel .concatenate .transpose .to_xr_dataarray</text>
  <text x="632" y="831" font-size="11" fill="#475569" font-family="Menlo, monospace" xml:space="preserve">value(i) = i*gain + offset  <tspan font-family="Helvetica">&#8212; regular sampling</tspan></text>
  <text x="632" y="867" font-size="11" fill="#475569" font-family="Menlo, monospace" xml:space="preserve">value(i) = data[i]          <tspan font-family="Helvetica">&#8212; explicit labels / irregular</tspan></text>
  <text x="632" y="900" font-size="10.5" fill="#94a3b8">dashed = CoordinateAxis also inherits ArrayWithNamedDims</text>
  </g>
</svg>
